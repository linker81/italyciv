<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>italiaciv — l'Italia come un gioco di strategia</title>
  <meta name="description" content="L'Italia vera disegnata come una mappa di strategia 4X: terreno a esagoni, città con le loro rese, lenti e risorse, tutto da dati pubblici.">
  <meta name="theme-color" content="#131e2a">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%23120d06'/%3E%3Ccircle cx='32' cy='32' r='29' fill='%23c9a45c'/%3E%3Ccircle cx='32' cy='32' r='24' fill='%23205c3b'/%3E%3Cpath fill='%23f8f0d8' d='M32 14l4.9 11.3 12.2 1.1-9.3 8.1 2.8 12-10.6-6.4-10.6 6.4 2.8-12-9.3-8.1 12.2-1.1z'/%3E%3C/svg%3E">
  <!-- Social card: se pubblichi la tua copia, aggiungi qui og:url e og:image con indirizzi assoluti. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="italiaciv">
  <meta property="og:title" content="L'Italia come mappa di un gioco di strategia">
  <meta property="og:description" content="L'Italia vera disegnata come una mappa di strategia 4X: terreno a esagoni, città con le loro rese, lenti e risorse, da dati pubblici (ISTAT, Il Sole 24 Ore, Natural Earth, WRI).">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand" title="Italia"><span class="brand-emblem" aria-hidden="true">★</span><span class="brand-text">Italia</span></div>
    <div id="yields" class="yields" aria-label="Rese nazionali"></div>
    <div class="spacer"></div>
    <div class="search" role="search">
      <span class="search-ic" aria-hidden="true"></span>
      <input id="search-input" type="search" placeholder="Cerca città e regioni" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" aria-label="Cerca città e regioni (/ o Ctrl K)">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <div id="turn" class="turn"></div>
    <div class="tb-buttons">
      <button id="btn-share" class="btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Condividi questa vista" title="Condividi: copia un link o scarica un'immagine"></button>
      <button id="btn-help" class="btn btn-icon" aria-label="Aiuto per tastiera e mouse" title="Aiuto (?)"></button>
      <button id="btn-pedia" class="btn" aria-label="Apri l'Almanacco" title="Che cosa significa ogni numero e da dove viene"></button>
    </div>
  </header>

  <canvas id="map" role="img" aria-label="Mappa a esagoni dell'Italia"></canvas>

  <div id="tooltip" class="tooltip" hidden></div>
  <aside id="city-panel" class="panel" hidden role="region" aria-label="Dettagli"></aside>

  <div id="lens-area">
    <div id="lens-picker" class="panel lens-picker" hidden role="dialog" aria-label="Scegli una lente"></div>
    <div id="legend" class="panel legend" hidden role="group" aria-label="Legenda della lente"></div>
    <div id="lens-dock" class="panel lens-dock" role="toolbar" aria-label="Lenti della mappa">
      <button id="btn-res" class="lens-btn res-toggle" aria-pressed="true" aria-label="Risorse sugli esagoni (R)" title="Mostra o nascondi le risorse sugli esagoni (R)" hidden></button>
      <div id="lens-quick" class="lens-quick"></div>
      <button id="btn-lenses" class="lens-btn lens-more" aria-haspopup="dialog" aria-expanded="false" aria-controls="lens-picker"></button>
    </div>
  </div>

  <div id="minimap-wrap" class="panel"><canvas id="minimap" aria-label="Minimappa: clicca per spostarti" role="img"></canvas></div>
  <button id="btn-minimap" class="panel minimap-toggle" aria-pressed="false" aria-controls="minimap-wrap" aria-label="Mostra la minimappa"></button>

  <div id="search-results" class="panel search-results" role="listbox" aria-label="Risultati della ricerca" hidden></div>
  <div id="share-pop" class="panel share-pop" role="dialog" aria-label="Condividi" hidden></div>
  <div id="yield-report" class="panel yield-report" role="dialog" aria-label="Rapporto nazionale" tabindex="-1" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="pedia" class="modal" hidden>
    <div class="modal-card panel" role="dialog" aria-modal="true" aria-label="Almanacco">
      <button class="close icon-btn" data-close aria-label="Chiudi l'Almanacco">✕</button>
      <nav id="pedia-nav" aria-label="Pagine dell'Almanacco"></nav>
      <article id="pedia-body"></article>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="help-card panel" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
  </div>

  <div id="loading">Sto esplorando il territorio…</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
